<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styled dashboard — CSS inside the HTML</title>
<style>
  body{
    margin: 0;
    padding: 40px 20px;
    font-family: system-ui, sans-serif;
    background: #0f1016;
    color: #ecebf4;
  }
  h1{ font-size: 1.4rem; margin: 0 0 20px; }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    max-width: 720px;
  }
  .stat{
    background: #191b24;
    border: 1px solid #2c2e3d;
    border-radius: 10px;
    padding: 18px;
  }
  .stat .label{ font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em; color: #6a6c82; }
  .stat .value{ font-size: 1.8rem; font-weight: 700; margin-top: 6px; }
  .up{ color: #35d07f; }
  .down{ color: #ff5d5d; }
  .bar{
    margin-top: 10px;
    height: 6px;
    border-radius: 4px;
    background: #262838;
    overflow: hidden;
  }
  .bar span{ display: block; height: 100%; background: #7c5cfc; }
</style>
</head>
<body>
  <h1>Weekly overview</h1>
  <div class="grid">
    <div class="stat">
      <div class="label">Visitors</div>
      <div class="value up">2,481</div>
      <div class="bar"><span style="width: 72%"></span></div>
    </div>
    <div class="stat">
      <div class="label">Bounce rate</div>
      <div class="value down">38%</div>
      <div class="bar"><span style="width: 38%"></span></div>
    </div>
    <div class="stat">
      <div class="label">Signups</div>
      <div class="value up">96</div>
      <div class="bar"><span style="width: 54%"></span></div>
    </div>
  </div>
</body>
</html>
